name: Monthly Mind Kernel Growth Report

on:
  schedule:
    # Run at 00:00 UTC (09:00 JST) on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Time range (e.g., "1 month ago")'
        required: true
        default: '1 month ago'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for git diff/log

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Determine time range
        id: range
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "SINCE=${{ github.event.inputs.since }}" >> $GITHUB_ENV
          else
            echo "SINCE=1 month ago" >> $GITHUB_ENV
          fi

      - name: Generate Growth Report
        id: generate
        run: |
          python3 scripts/analyze_growth.py --since "$SINCE" > report.md
          
          # Display report in log for debugging
          cat report.md

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install slack_sdk markdown pdfkit

      - name: Convert to PDF
        run: |
          cat <<EOF > generate_pdf.py
          import markdown
          import pdfkit
          import os

          with open('report.md', 'r') as f:
              text = f.read()

          # Simple Github-like CSS
          style = '''
          <style>
              body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; line-height: 1.6; max-width: 900px; margin: 0 auto; padding: 2rem; color: #24292e; }
              h1 { border-bottom: 1px solid #eaecef; padding-bottom: .3em; }
              h2 { border-bottom: 1px solid #eaecef; padding-bottom: .3em; margin-top: 24px; }
              code { background-color: rgba(27,31,35,.05); padding: .2em .4em; border-radius: 3px; font-family: SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace; }
              blockquote { border-left: .25em solid #dfe2e5; color: #6a737d; padding: 0 1em; margin-left: 0; }
              ul { padding-left: 2em; }
              li { margin-bottom: 0.25em; }
          </style>
          '''

          html_content = markdown.markdown(text, extensions=['fenced_code', 'tables'])
          full_html = f'<!DOCTYPE html><html><head><meta charset="utf-8">{style}</head><body>{html_content}</body></html>'

          # Convert to PDF
          options = {
              'encoding': "UTF-8",
              'no-outline': None,
              'margin-top': '0.75in',
              'margin-right': '0.75in',
              'margin-bottom': '0.75in',
              'margin-left': '0.75in',
          }
          pdfkit.from_string(full_html, 'report.pdf', options=options)
          EOF
          
          python3 generate_pdf.py

      - name: Upload to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        if: env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          python3 -c "
          import os
          from slack_sdk import WebClient
          from slack_sdk.errors import SlackApiError

          token = os.environ['SLACK_BOT_TOKEN']
          channel_id = os.environ['SLACK_CHANNEL_ID']
          since_label = os.environ.get('SINCE', 'unknown')
          
          client = WebClient(token=token)
          
          try:
              # files_upload_v2 handles the complex 3-step upload process automatically
              response = client.files_upload_v2(
                  channel=channel_id,
                  file='report.pdf',
                  title=f'Mind Kernel Growth Report ({since_label})',
                  initial_comment=f'🔄 *Mind Kernel Growth Report* ({since_label})',
                  filename='report.pdf'
              )
              print('Upload successful')
          except SlackApiError as e:
              print(f'Error uploading file: {e}')
              exit(1)
          "
